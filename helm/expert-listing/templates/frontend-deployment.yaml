{{- with .Values.frontend }}
{{- if .image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "expert-listing.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "expert-listing.selectorLabels" (dict "root" $ "component" "frontend") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "expert-listing.labels" (dict "root" $ "component" "frontend") | nindent 8 }}
        app.kubernetes.io/version: {{ .image.tag | quote }}
      annotations:
        expert-listing/git-commit: {{ .commit | default .image.tag | quote }}
        expert-listing/source-repository: {{ .sourceRepository | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "expert-listing.image" (dict "root" $ "image" .image) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .containerPort }}
          env:
            - name: APP_ENV
              value: {{ $.Values.global.environment | quote }}
            {{- range $name, $value := .env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: {{ .probes.liveness }}
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: {{ .probes.liveness }}
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .probes.readiness }}
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
