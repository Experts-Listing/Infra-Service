{{- $services := list (dict "name" "backend" "values" .Values.backend) (dict "name" "geo-bucket" "values" .Values.geoBucket) (dict "name" "frontend" "values" .Values.frontend) }}
{{- range $services }}
{{- if and $.Values.ingress.enabled .values.image.tag }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  labels:
    {{- include "expert-listing.labels" (dict "root" $ "component" .name) | nindent 4 }}
  annotations:
    # All services in an environment share one ALB; lower order wins, so the frontend's "/" catch-all goes last.
    alb.ingress.kubernetes.io/group.name: expert-listing-{{ $.Values.global.environment }}
    alb.ingress.kubernetes.io/group.order: {{ .values.ingressOrder | quote }}
    {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: {{ .values.ingressPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}
                port:
                  name: http
      {{- with $.Values.ingress.host }}
      host: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
